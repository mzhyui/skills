interface:
  display_name: "Record Coding Progress"
  short_description: "Write clear handoffs, evaluation readouts, and session records"
  default_prompt: "Use $record-coding-progress to write a format-4 record: choose implementation, evaluation, or session; lead with the outcome, readout, or takeaways; keep commands and Git custody in the folded appendix; then validate it."

policy:
  allow_implicit_invocation: true
